---
- name: Build CampusBite candidate image safely
  hosts: web
  become: true
  gather_facts: false

  vars:
    staging_dir: /home/ubuntu/campusbite-staging
    upload_dir: /home/ubuntu/campusbite-staging-upload
    archive_name: campusbite-staging.tar.gz
    candidate_image: campusbite:candidate

  tasks:
    - name: Create AWS staging directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      loop:
        - "{{ staging_dir }}"
        - "{{ upload_dir }}"

    - name: Upload source archive to AWS
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ archive_name }}"
        dest: "{{ upload_dir }}/{{ archive_name }}"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Extract source archive into staging
      ansible.builtin.unarchive:
        src: "{{ upload_dir }}/{{ archive_name }}"
        dest: "{{ staging_dir }}"
        remote_src: true

    - name: Check staging Dockerfile
      ansible.builtin.stat:
        path: "{{ staging_dir }}/Dockerfile"
      register: dockerfile_check

    - name: Check staging server file
      ansible.builtin.stat:
        path: "{{ staging_dir }}/server.js"
      register: server_check

    - name: Require candidate build inputs
      ansible.builtin.assert:
        that:
          - dockerfile_check.stat.exists
          - server_check.stat.exists
        fail_msg: "Required staging files are missing. Live application was not changed."

    - name: Build candidate Docker image from staging
      ansible.builtin.command:
        cmd: docker build -t "{{ candidate_image }}" "{{ staging_dir }}"
      changed_when: true

    - name: Verify candidate image exists
      ansible.builtin.command:
        cmd: docker image inspect "{{ candidate_image }}"
      changed_when: false

    - name: Report candidate build result
      ansible.builtin.debug:
        msg: "Candidate image verified. The live container and production environment were not changed."
